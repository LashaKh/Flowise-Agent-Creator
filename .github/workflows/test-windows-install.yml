name: Test Windows OpenClaw Install

on:
  workflow_dispatch:
  push:
    paths:
      - 'personahub-desktop/electron/openclaw-manager.ts'

jobs:
  test-install:
    runs-on: windows-latest

    steps:
      - name: Download Node.js 22 (same as app does)
        shell: pwsh
        run: |
          $nodeVersion = "22.22.0"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          $runtimeDir = "$env:USERPROFILE\.personahub\runtime"
          $zipPath = "$runtimeDir\node.zip"

          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Write-Host "Downloading Node.js $nodeVersion..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          Write-Host "Extracting..."
          Expand-Archive -Path $zipPath -DestinationPath $runtimeDir -Force
          Remove-Item $zipPath
          Write-Host "Done. Node at: $runtimeDir\node-v$nodeVersion-win-x64"

      - name: Run npm.cmd install with --prefix (same as app)
        shell: pwsh
        run: |
          $nodeVersion = "22.22.0"
          $runtimePrefix = "$env:USERPROFILE\.personahub\runtime\node-v$nodeVersion-win-x64"
          $npmCmd = "$runtimePrefix\npm.cmd"

          Write-Host "=== Testing the FIXED command ==="
          Write-Host "Running: $npmCmd install -g --no-optional --prefix $runtimePrefix openclaw@latest"
          & $npmCmd install -g --no-optional --prefix "$runtimePrefix" openclaw@latest
          if ($LASTEXITCODE -ne 0) { Write-Error "npm install FAILED"; exit 1 }
          Write-Host "npm install SUCCEEDED"

      - name: Verify openclaw.cmd exists in runtime dir
        shell: pwsh
        run: |
          $nodeVersion = "22.22.0"
          $runtimePrefix = "$env:USERPROFILE\.personahub\runtime\node-v$nodeVersion-win-x64"
          $openclawCmd = "$runtimePrefix\openclaw.cmd"

          Write-Host "Looking for: $openclawCmd"
          if (Test-Path $openclawCmd) {
            Write-Host "SUCCESS: openclaw.cmd found at $openclawCmd"
          } else {
            Write-Host "Listing files in runtime dir:"
            Get-ChildItem $runtimePrefix -Filter "openclaw*" -Recurse | ForEach-Object { Write-Host $_.FullName }
            Write-Error "FAILED: openclaw.cmd not found at expected path"
            exit 1
          }
