name: Test Windows OpenClaw Install

on:
  workflow_dispatch:
  push:
    paths:
      - 'personahub-desktop/electron/openclaw-manager.ts'

jobs:
  test-install:
    runs-on: windows-latest

    steps:
      - name: Remove git from PATH (simulate user without git)
        shell: cmd
        run: |
          echo Removing git directories from PATH...
          set "CLEAN_PATH="
          setlocal enabledelayedexpansion
          for %%p in ("%PATH:;=";"%") do (
            echo %%~p | findstr /i /c:"git" >nul
            if errorlevel 1 (
              if defined CLEAN_PATH (
                set "CLEAN_PATH=!CLEAN_PATH!;%%~p"
              ) else (
                set "CLEAN_PATH=%%~p"
              )
            ) else (
              echo   Removed: %%~p
            )
          )
          echo PATH=!CLEAN_PATH!>> %GITHUB_ENV%

      - name: Verify git is NOT available
        shell: cmd
        run: |
          git --version >nul 2>&1
          if %ERRORLEVEL% EQU 0 (
            echo ERROR: git should not be available
            exit /b 1
          )
          echo CONFIRMED: git is NOT on PATH

      - name: Download Node.js 22
        shell: pwsh
        run: |
          $nodeVersion = "22.22.0"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          $runtimeDir = "$env:USERPROFILE\.personahub\runtime"
          $zipPath = "$runtimeDir\node.zip"

          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Write-Host "Downloading Node.js $nodeVersion..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          Write-Host "Extracting..."
          Expand-Archive -Path $zipPath -DestinationPath $runtimeDir -Force
          Remove-Item $zipPath
          Write-Host "Done"

      - name: Download MinGit (same as app does when git is missing)
        shell: pwsh
        run: |
          $mingitVersion = "2.47.1"
          $url = "https://github.com/git-for-windows/git/releases/download/v$mingitVersion.windows.1/MinGit-$mingitVersion-64-bit.zip"
          $runtimeDir = "$env:USERPROFILE\.personahub\runtime"
          $mingitDir = "$runtimeDir\mingit"
          $zipPath = "$runtimeDir\mingit.zip"

          New-Item -ItemType Directory -Path $mingitDir -Force | Out-Null
          Write-Host "Downloading MinGit $mingitVersion..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          Write-Host "Extracting..."
          Expand-Archive -Path $zipPath -DestinationPath $mingitDir -Force
          Remove-Item $zipPath
          Write-Host "MinGit ready at: $mingitDir"

      - name: Run npm install with MinGit in PATH (same as app)
        shell: cmd
        run: |
          set "NODEVERSION=22.22.0"
          set "RUNTIMEPREFIX=%USERPROFILE%\.personahub\runtime\node-v%NODEVERSION%-win-x64"
          set "NPMCMD=%RUNTIMEPREFIX%\npm.cmd"
          set "MINGITBIN=%USERPROFILE%\.personahub\runtime\mingit\cmd"

          echo Adding MinGit to PATH: %MINGITBIN%
          set "PATH=%MINGITBIN%;%PATH%"

          echo Verifying git is now available via MinGit...
          git --version

          echo Running: %NPMCMD% install -g --prefix "%RUNTIMEPREFIX%" openclaw@latest
          "%NPMCMD%" install -g --prefix "%RUNTIMEPREFIX%" openclaw@latest
          if %ERRORLEVEL% NEQ 0 (
            echo FAILED: npm install failed
            exit /b 1
          )
          echo SUCCESS: npm install completed

      - name: Verify openclaw.cmd exists
        shell: pwsh
        run: |
          $nodeVersion = "22.22.0"
          $openclawCmd = "$env:USERPROFILE\.personahub\runtime\node-v$nodeVersion-win-x64\openclaw.cmd"

          if (Test-Path $openclawCmd) {
            Write-Host "SUCCESS: openclaw.cmd found at $openclawCmd"
          } else {
            Write-Host "Searching for openclaw.cmd..."
            Get-ChildItem "$env:USERPROFILE\.personahub\runtime" -Filter "openclaw*" -Recurse | ForEach-Object { Write-Host $_.FullName }
            Write-Error "FAILED: openclaw.cmd not found"
            exit 1
          }
