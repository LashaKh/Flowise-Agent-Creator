name: Build Desktop App

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        working-directory: personahub-desktop
        run: pnpm install

      - name: Run tests
        working-directory: personahub-desktop
        run: pnpm test

      # Native modules need a Windows-flavored binary on Windows runners.
      # `electron-builder install-app-deps` (postinstall) usually does this,
      # but pnpm's strict mode can skip it silently — the explicit rebuild
      # is cheap insurance against "app crashes on first DB read" on Windows.
      - name: Rebuild native modules for Windows
        if: matrix.platform == 'win'
        working-directory: personahub-desktop
        run: pnpm rebuild better-sqlite3

      # ─── macOS: build for both architectures, ad-hoc sign, then publish ─
      # Until Apple Developer ID + notarization secrets are configured,
      # we ad-hoc sign so the app at least runs locally for users who run
      # the documented `xattr -cr` workaround. Once notarization is wired
      # this whole block can collapse into a single `--publish always`.
      - name: Build (macOS, both archs, no publish yet)
        if: matrix.platform == 'mac'
        working-directory: personahub-desktop
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          # Explicit --x64 --arm64 so electron-builder builds BOTH archs
          # even if some future config tweak makes the target's arch array
          # ambiguous. Belt-and-suspenders against host-arch-only fallbacks.
          pnpm exec electron-builder --mac --x64 --arm64 --config electron-builder.config.js --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Baked into the build via Vite `define` — never appears in source.
          PERSONAHUB_OPENROUTER_KEY: ${{ secrets.PERSONAHUB_OPENROUTER_KEY }}

      # electron-builder names the host-arch output dir `release/mac` and
      # cross-arch dirs as `release/mac-<arch>`. On macos-latest (arm64),
      # x64 lands in `release/mac` while arm64 lands in `release/mac-arm64`.
      # Normalize both to `release/mac-<arch>` so the sign + repackage loops
      # below can iterate uniformly. Without this, the x64 DMG silently gets
      # built from the arm64 prepackaged input — Intel users get an arm64 app.
      - name: Normalize macOS output directory naming
        if: matrix.platform == 'mac'
        working-directory: personahub-desktop
        run: |
          if [ -d "release/mac" ] && [ ! -d "release/mac-x64" ]; then
            mv release/mac release/mac-x64
            echo "Renamed release/mac → release/mac-x64"
          fi
          ls -la release/

      - name: Ad-hoc sign macOS apps (arm64 + x64)
        if: matrix.platform == 'mac'
        working-directory: personahub-desktop
        run: |
          for arch in arm64 x64; do
            APP_PATH=$(find "release/mac-${arch}" -maxdepth 2 -name "*.app" 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              codesign --force --deep --sign - "$APP_PATH"
              echo "Ad-hoc signed: $APP_PATH"
            else
              echo "WARNING: no .app found under release/mac-${arch}"
            fi
          done

      - name: Repackage and publish macOS DMGs (arm64 + x64)
        if: matrix.platform == 'mac'
        working-directory: personahub-desktop
        run: |
          rm -f release/*.dmg release/*.dmg.blockmap release/*.zip release/*.zip.blockmap release/latest-mac.yml
          for arch in arm64 x64; do
            if [ -d "release/mac-${arch}" ]; then
              # Pass --${arch} explicitly so electron-builder ONLY produces
              # DMGs for this arch from this prepackaged input. Without it,
              # the build runs the config's full arch matrix and packages
              # the same prepackaged input into both arch-named DMGs —
              # producing an x64.dmg that secretly contains arm64 content.
              pnpm exec electron-builder --mac --${arch} --config electron-builder.config.js --prepackaged "release/mac-${arch}" --publish always
            else
              echo "WARNING: release/mac-${arch} missing, skipping"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Baked into the build via Vite `define` — never appears in source.
          PERSONAHUB_OPENROUTER_KEY: ${{ secrets.PERSONAHUB_OPENROUTER_KEY }}

      # ─── Windows: build with publish so latest.yml + blockmap upload ───
      - name: Build & publish (Windows)
        if: matrix.platform == 'win'
        working-directory: personahub-desktop
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          pnpm exec electron-builder --win --config electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Baked into the build via Vite `define` — never appears in source.
          PERSONAHUB_OPENROUTER_KEY: ${{ secrets.PERSONAHUB_OPENROUTER_KEY }}

      # ─── Linux: build with publish so latest-linux.yml uploads ────────
      - name: Build & publish (Linux)
        if: matrix.platform == 'linux'
        working-directory: personahub-desktop
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          pnpm exec electron-builder --linux --config electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Baked into the build via Vite `define` — never appears in source.
          PERSONAHUB_OPENROUTER_KEY: ${{ secrets.PERSONAHUB_OPENROUTER_KEY }}
