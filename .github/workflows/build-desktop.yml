name: Build Desktop App

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        working-directory: personahub-desktop
        run: pnpm install

      - name: Run tests
        working-directory: personahub-desktop
        run: pnpm test

      # Native modules need a Windows-flavored binary on Windows runners.
      # `electron-builder install-app-deps` (postinstall) usually does this,
      # but pnpm's strict mode can skip it silently — the explicit rebuild
      # is cheap insurance against "app crashes on first DB read" on Windows.
      - name: Rebuild native modules for Windows
        if: matrix.platform == 'win'
        working-directory: personahub-desktop
        run: pnpm rebuild better-sqlite3

      # ─── macOS: build for both architectures, ad-hoc sign, then publish ─
      # Until Apple Developer ID + notarization secrets are configured,
      # we ad-hoc sign so the app at least runs locally for users who run
      # the documented `xattr -cr` workaround. Once notarization is wired
      # this whole block can collapse into a single `--publish always`.
      - name: Build (macOS, both archs, no publish yet)
        if: matrix.platform == 'mac'
        working-directory: personahub-desktop
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          pnpm exec electron-builder --mac --config electron-builder.config.js --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Ad-hoc sign macOS apps (arm64 + x64)
        if: matrix.platform == 'mac'
        working-directory: personahub-desktop
        run: |
          for arch in arm64 x64; do
            APP_PATH=$(find "release/mac-${arch}" -maxdepth 2 -name "*.app" 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              codesign --force --deep --sign - "$APP_PATH"
              echo "Ad-hoc signed: $APP_PATH"
            fi
          done

      - name: Repackage and publish macOS DMGs (arm64 + x64)
        if: matrix.platform == 'mac'
        working-directory: personahub-desktop
        run: |
          rm -f release/*.dmg release/*.dmg.blockmap release/*.zip release/*.zip.blockmap release/latest-mac.yml
          for arch in arm64 x64; do
            if [ -d "release/mac-${arch}" ]; then
              pnpm exec electron-builder --mac --config electron-builder.config.js --prepackaged "release/mac-${arch}" --publish always
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # ─── Windows: build with publish so latest.yml + blockmap upload ───
      - name: Build & publish (Windows)
        if: matrix.platform == 'win'
        working-directory: personahub-desktop
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          pnpm exec electron-builder --win --config electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # ─── Linux: build with publish so latest-linux.yml uploads ────────
      - name: Build & publish (Linux)
        if: matrix.platform == 'linux'
        working-directory: personahub-desktop
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          pnpm exec electron-builder --linux --config electron-builder.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
